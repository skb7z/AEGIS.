name: Build Aegis APK

on:
  workflow_dispatch:

concurrency:
  group: aegis-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare signing key
        run: |
          mkdir -p ~/.android
          if [ -f keystore/aegis.keystore.b64 ]; then
            base64 -d keystore/aegis.keystore.b64 > ~/.android/debug.keystore
            echo "Using the permanent keystore from the repo"
          else
            echo "WARNING: keystore/aegis.keystore.b64 not found - generating a temporary key (Google sign-in will not match Firebase)"
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=== Signing key SHA-1 (must start with AA:A2:80:DB) ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
            -storepass android | grep -E "SHA1"

      - name: Bootstrap project
        run: bash tool/bootstrap.sh

      - name: Build ONE release APK (arm + arm64, all phones)
        run: flutter build apk --release --no-shrink --target-platform android-arm,android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-APK
          path: build/app/outputs/flutter-apk/app-release.apk
