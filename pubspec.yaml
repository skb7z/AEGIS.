name: aegis
description: Aegis - bilingual voice assistant for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  connectivity_plus: ^6.0.5
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/aegis_logo.png"
  min_sdk_android: 26
